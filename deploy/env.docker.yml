# docker-compose 专用配置(容器内用服务名 DNS,mysql:3306 / redis:6379)。
# 敏感项(ORDERD_JWT_KEYS / ORDERD_MYSQL_PASSWORD / ORDERD_ALIPAY_*)由 compose 的 environment 注入,不写此处。
env: dev

log:
  level: debug
  json: false

grpc:
  addr: ":9090"

http:
  addr: ":8080"
  notifybaseurl: "http://orderd:8080"

database:
  dbtype: "mysql"
  host: "mysql"
  port: "3306"
  user: "root"
  dbname: "orderd"
  # 口令由 compose 的 ORDERD_MYSQL_PASSWORD env 覆盖(见 docker-compose.yml)

redis:
  addr: "redis:6379"
  dbs: [0, 1, 2]

snowflake:
  machineid: 0

order:
  ttl: "30m"
  attemptttl: "15m"

refund:
  enabled: true

pricing:
  trustcaller: true   # dev 采信 BFF 金额;生产须改回 false 或经严格服务身份

auth:
  issuer: "bff"
  audience: "orderd"

pay:
  alipay:
    enabled: false
  wechat:
    enabled: false
