# orderd 配置模板。复制为 env.yml 按环境填写;敏感项走环境变量,勿写入本文件。
#
# 环境变量(敏感项,不入库):
#   ORDERD_JWT_KEYS            "kid=secret,kid2=secret2"(必填,禁止无鉴权启动)
#   ORDERD_MYSQL_PASSWORD      MySQL 口令
#   ORDERD_ALIPAY_PRIVATE_KEY  支付宝应用私钥(alipay.enabled=true 必填)
#   ORDERD_ALIPAY_PUBLIC_KEY   支付宝公钥(普通公钥模式,alipay.enabled=true 必填)
#   ORDERD_WEBHOOK_SECRETS     "ref=secret"(dev)
env: prod

grpc:
  addr: ":9090"

http:
  addr: ":8080"
  notifybaseurl: "https://pay.example.com"

# ---------------------------------------------------------------------------
# 数据库（MySQL）
# ---------------------------------------------------------------------------
database:
  dbtype: "mysql"
  host: "mysql"
  port: "3306"
  dbname: "orderd"
  user: "orderd"
  password: ""          # 敏感:部署时填(挂载的 env.yml),或用 env ORDERD_MYSQL_PASSWORD 覆盖
  maxopenconn: 50       # 最大打开连接
  maxidleconn: 25       # 空闲连接(须 ≤ maxopenconn)
  maxlifeseconds: 1800  # 连接最大存活 30 分钟

# ---------------------------------------------------------------------------
# Redis
# ---------------------------------------------------------------------------
redis:
  addr: ""              # 空=不启用(orderd 当前未消费 Redis)
  password: ""
  dbs: [0, 1, 2]
  prefix: ""

# ---------------------------------------------------------------------------
# 日志
# ---------------------------------------------------------------------------
log:
  sql: 1
  compress: 0
  consolestdout: 1
  filestdout: 1
  level: "debug"
  localtime: 1
  maxage: 30
  maxbackups: 30
  maxsize: 64
  # 开发环境日志目录。
  path: "./logs/orderd"
# ---------------------------------------------------------------------------
# 雪花算法
# ---------------------------------------------------------------------------
snowflake:
  machineid: 0

# ---------------------------------------------------------------------------
# Worker
# ---------------------------------------------------------------------------
worker:
  id: ""

# ---------------------------------------------------------------------------
# 订单
# ---------------------------------------------------------------------------
order:
  ttl: "30m"
  maxpendingperuser: 5   # 单用户待支付订单数上限(近似防刷;0=不限)
  latepaymentrefundapps: [] # 已废弃的迟到付款策略检测项；只能留空列表 []（默认），非空启动失败；有效付款统一恢复 CLOSED/CANCELLED 为 PAID，与 refund.enabled 无关
  attemptttl: "15m"

# ---------------------------------------------------------------------------
# 退款
# ---------------------------------------------------------------------------
refund:
  enabled: true

# ---------------------------------------------------------------------------
# 对账
# ---------------------------------------------------------------------------
reconcile:
  # 启用真实渠道账单与支付/退款核对；默认false，需对应pay渠道凭据、增量迁移和真实模板验收。
  enabled: false
  # 每轮账号扫描间隔；留空默认1m，必须为正Go duration；历史恢复/补偿吞吐受每轮页数上限约束。
  interval: "1m"
  # 仅对完整已发布账单中的既有支付/退款查单确认成功；默认false，true必须enabled=true。
  # 不发起扣款/退款、不把失败/不存在查单结果写入业务状态；真实渠道验收后再灰度开启。
  auto_confirm: false

# ---------------------------------------------------------------------------
# Outbox 死信兜底重放(默认关闭:上线观察死信量级与端点健康后再开;间隔小时级)。
# 次数上限 = 投递死信阈值(8) + max_auto_requeues;attempts 不重置,一次重放=一次投递机会。
# ---------------------------------------------------------------------------
outbox:
  deadletter:
    enabled: false
    interval: "1h"          # 轮询间隔
    cooldown: "1h"          # 转死信后的冷却
    max_auto_requeues: 3    # 自动重放追加次数上限
    max_lifetime: "168h"    # 存活上限(超过后永久停手,人工重放仍可用)

# ---------------------------------------------------------------------------
# Webhook
# ---------------------------------------------------------------------------
webhook:
  allowhosts: []
  allowcidrs: []

# ---------------------------------------------------------------------------
# 密钥挂载目录(K8s Secret volume / Vault agent 投递面):引用名 → 目录下同名文件内容。
# 配置后 webhook HMAC 密钥走目录解析(轮换由编排层更新文件,免重启);
# 未配置回退 env ORDERD_WEBHOOK_SECRETS(仅 dev)。
# ---------------------------------------------------------------------------
secrets:
  dir: ""

# ---------------------------------------------------------------------------
# 计价
# ---------------------------------------------------------------------------
pricing:
  trustcaller: false

# ---------------------------------------------------------------------------
# 告警送达通道(资金异常/死信/滞留)。未配置 provider 时仅日志告警。
# webhook_url 含 token 属敏感:只填在 git 忽略且挂载注入的 env.yml,禁入库/git/日志。
# ---------------------------------------------------------------------------
alert:
  provider: ""     # dingtalk / feishu / generic;空=未启用
  webhook_url: ""  # 群机器人/自建网关地址(敏感)
  secret: ""       # 可选:钉钉加签 / 飞书签名密钥(敏感)

# ---------------------------------------------------------------------------
# 认证
# ---------------------------------------------------------------------------
auth:
  issuer: "bff"
  audience: "orderd"

# ---------------------------------------------------------------------------
# 支付
# ---------------------------------------------------------------------------
# 支付渠道。敏感凭据(private_key/apiv3/证书)一律留空提交,部署时填在挂载的 env.yml 或用 *_path。
pay:
  alipay:
    enabled: false
    app_id: ""
    is_production: true
    notify_url: ""                 # https://<域名>/notify/alipay/<route_id>
    account_id: "acc-alipay"       # == app_pay_accounts.pay_account_id
    route_id: "alipay"             # == app_pay_accounts.notify_route_id
    trade_type: "native"           # native/page/wap/app/jsapi
    private_key: ""                # 与 private_key_path 二选一(敏感,勿提交)
    private_key_path: ""
    # 证书模式(三项全填或全空;否则用下方 alipay_public_key 普通公钥模式):
    app_cert_public_key: ""
    app_cert_public_key_path: ""
    alipay_root_cert: ""
    alipay_root_cert_path: ""
    alipay_cert_public_key: ""
    alipay_cert_public_key_path: ""
    alipay_public_key: ""          # 普通公钥模式必填
  wechat:
    enabled: false
    app_id: ""                     # 开放平台 appid
    mch_id: ""                     # 商户号
    notify_url: ""                 # https://<域名>/notify/wechat/<route_id>
    account_id: "acc-wechat"
    route_id: "wechat"
    trade_type: "native"           # native/jsapi/app/h5
    mch_cert_serial_number: ""     # 微信支付证书序列号
    mch_apiv3_key: ""              # APIv3 密钥(敏感,勿提交)
    mch_private_key_path: ""       # 与 pem 二选一
    mch_private_key_pem: ""
    wechatpay_certificate_path: "" # 证书模式,与公钥模式二选一
    wechatpay_certificate_pem: ""
    wechatpay_public_key_id: ""    # 公钥模式
    wechatpay_public_key_path: ""
    wechatpay_public_key_pem: ""
